[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"

# Sandboxed/offline machines: download solc-macos 0.8.28 into .solc/ and run with FOUNDRY_PROFILE=local
[profile.local]
solc = ".solc/solc-0.8.28"

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 256
fail_on_revert = false

[lint]
exclude_lints = ["block-timestamp"]

[rpc_endpoints]
monad_testnet = "${MONAD_RPC_URL}"
